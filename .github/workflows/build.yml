name: Build APK

on:
  push:
    branches:
      - main
      - 'ccr-**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and release
    runs-on: ubuntu-latest
    env:
      # Every CI run gets a new, increasing versionCode so updates install over older builds.
      APP_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare APK files
        id: apk
        run: |
          VERSION="1.0.${APP_BUILD_NUMBER}"
          VERSIONED="exif-csv-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$VERSIONED"
          cp app/build/outputs/apk/release/app-release.apk exif-csv.apk
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versioned=$VERSIONED" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: exif-csv-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.versioned }}

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: EXIF → CSV ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ${{ steps.apk.outputs.versioned }}
            exif-csv.apk
          body: |
            Automaticky sestavené APK z commitu `${{ github.sha }}`.

            **Instalace:** stáhněte `exif-csv.apk`, otevřete ho v telefonu a povolte instalaci z neznámých zdrojů.
            Nová verze se nainstaluje přes starou (stejný podpisový klíč).
